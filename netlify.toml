[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/hls-proxy"
  to = "/.netlify/functions/hls-proxy"
  status = 200

[[redirects]]
  from = "/api/sportsdb"
  to = "/.netlify/functions/sportsdb"
  status = 200

[[redirects]]
  from = "/api/rapidapi-stream/*"
  to = "/.netlify/functions/rapidapi-stream/:splat"
  status = 200

[[redirects]]
  from = "/api/nvidia/*"
  to = "/.netlify/functions/nvidia/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
